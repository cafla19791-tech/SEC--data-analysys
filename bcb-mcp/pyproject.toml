[project]
name = "bcb-mcp"
version = "0.1.0"
description = "MCP server + CLI for Banco Central do Brasil open data (SGS, OLINDA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.6.0",
  "httpx>=0.28.0",
]

[project.scripts]
bcb-mcp = "bcb_mcp.server:main"
bcb-cli = "bcb_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcb_mcp"]
