[project]
name = "bis-mcp"
version = "0.1.0"
description = "MCP server + CLI for BIS central bank policy rates (WS_CBPOL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.6.0,<2",
  "httpx>=0.28.0",
]

[project.scripts]
bis-mcp = "bis_mcp.server:main"
bis-cli = "bis_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bis_mcp"]
