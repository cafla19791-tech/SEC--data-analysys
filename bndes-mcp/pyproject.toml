[project]
name = "bndes-mcp"
version = "0.1.0"
description = "MCP server + CLI for BNDES financing operations (consulta por CNPJ/CPF)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.6.0,<2",
  "httpx>=0.28.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "xlsxwriter>=3.1.0",
]

[project.scripts]
bndes-mcp = "bndes_mcp.server:main"
bndes-cli = "bndes_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bndes_mcp"]
