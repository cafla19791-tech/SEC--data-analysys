[project]
name = "sec-edgar-mcp"
version = "0.1.0"
description = "MCP server + CLI for SEC EDGAR filings and XBRL company facts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.6.0",
  "httpx>=0.28.0",
]

[project.scripts]
sec-edgar-mcp = "sec_edgar_mcp.server:main"
sec-edgar-cli = "sec_edgar_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_edgar_mcp"]
