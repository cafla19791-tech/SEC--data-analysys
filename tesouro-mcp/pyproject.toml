[project]
name = "tesouro-mcp"
version = "0.1.0"
description = "MCP server + CLI for Tesouro Nacional fiscal statistics (RTN / ARIA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.6.0",
  "httpx>=0.28.0",
]

[project.scripts]
tesouro-mcp = "tesouro_mcp.server:main"
tesouro-cli = "tesouro_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesouro_mcp"]
